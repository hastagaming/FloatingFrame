plugins {
    id 'com.android.library'
    id 'maven-publish'
}

android {
    namespace 'com.Frame.FloatingFrame'
    compileSdk 34

    defaultConfig {
        minSdk 24
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.findByName("release")
                
                groupId = 'com.Frame'
                artifactId = 'FloatingFrame'
                version = '1.0.0'
            }
        }
        repositories {
            maven {
                url = "${project.projectDir}/../maven-repo"
            }
        }
    }
}
